name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.24.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build --filter='./packages/*'

      - name: Type check
        run: pnpm --filter '@grovebox/web' typecheck

      - name: Lint
        run: pnpm --filter '@grovebox/web' lint

      - name: Test
        run: pnpm --filter '@grovebox/web' test

      - name: Format check
        run: pnpm format:check

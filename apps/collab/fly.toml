# fly.toml — Fly.io deployment config for the Notedraw collaboration server.
#
# Prerequisites:
#   fly auth login
#   fly apps create notedraw-collab  (first time only)
#
# Deploy:
#   fly deploy --config apps/collab/fly.toml
#
# Set secrets before deploying:
#   fly secrets set COLLAB_ALLOWED_ORIGINS=https://notedraw.com --app notedraw-collab
#   fly secrets set SENTRY_DSN=<dsn> --app notedraw-collab
#   fly secrets set COLLAB_REDIS_URL=<redis-url> --app notedraw-collab  # optional

app            = "notedraw-collab"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # Build context must be the monorepo root:
  #   fly deploy --config apps/collab/fly.toml --dockerfile apps/collab/Dockerfile

[env]
  PORT     = "4001"
  NODE_ENV = "production"

[http_service]
  internal_port       = 4001
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # Liveness probe — uses the /healthz endpoint added in Phase 6.2
  [[http_service.checks]]
    interval     = "15s"
    timeout      = "5s"
    grace_period = "10s"
    method       = "GET"
    path         = "/healthz"

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
